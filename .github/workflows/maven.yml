name: Build and test

on:
  push:

jobs:
  maven-build-test:
    runs-on: ubuntu-latest
# SETUP
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v7
      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
# BUILD
      - name: Download dependencies
        run: ./mvnw dependency:go-offline --show-version --batch-mode --no-transfer-progress
      - name: Build
        run: ./mvnw install -DskipTests=true -Dmaven.javadoc.skip=true --batch-mode
# TEST
      - name: Run tests
        run: ./mvnw test --batch-mode
# DOCKER BUILD
      - name: Build for docker
        run: ./mvnw clean install -DskipTests=true -Pdocker --batch-mode
