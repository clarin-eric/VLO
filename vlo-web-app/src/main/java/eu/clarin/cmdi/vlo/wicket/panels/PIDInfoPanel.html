        <title>PID info panel</title>
        <meta charset="UTF-8" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css" rel="stylesheet" />

    <body>
        <wicket:panel>
            <div class="container-fluid">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="text-center">

                            <p>
                                The persistent identifier for the <strong wicket:id="pidContextLabel1">metadata record</strong> is:
                            </p>

                            <div class="form-group">
                                <div class="input-group">
                                    <input wicket:id="pidInputField" id="pidInputField" type="text" class="form-control" readonly="readonly" aria-describedby="copy-addon" value="hdl:1234/5678" />
                                    <span class="input-group-btn">
                                        <button class="btn btn-default clipboard" data-clipboard-target="#pidInputField" type="button" title="Copy to clipboard"><i class="fa fa-copy"></i></button>
                                    </span>
                                </div>
                            </div>

                            <p>
                                You can use this <strong wicket:id="pidTypeLabel">handle</strong> to reference the <span wicket:id="pidContextLabel2">metadata record</span>
                                online and in publications, or use it with tools that support <span wicket:id="pidTypeLabelPlural">handles</span>.
                            </p>

                            <wicket:enclosure child="resolvedLinkPanel">
                                <div wicket:id="resolvedLinkPanel" class="card">
                                    <div class="card-body">
                                        <p>
                                            This identifier resolves to:
                                        </p>
                                        <p>
                                            <span wicket:id="resolvedLink"><a href="#">https://www.clarin.eu/</a></span>
                                        </p>
                                    </div>
                                </div>
                            </wicket:enclosure>
                            <p>
                                <a wicket:id="pidLink" href="#" class="btn btn-primary" target="_blank"><span class="fa-solid fa-hand-point-right"></span>
                                    &nbsp;Go to the <span wicket:id="pidContextLabel3">record</span></a>
                            </p>
                        </div>
                    </div>
                </div>
