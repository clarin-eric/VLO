<html lang="en-GB"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org" >

    <head>
        <title wicket:id="title">CLARIN VLO</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta wicket:id="pageDescription" name="description" content="" />
        <meta name="msvalidate.01" content="5328C9E13F0CD2549D6E6F4218714CBC" />
        <link wicket:id="canonicalUrl" rel="canonical" />
        <link rel="stylesheet" href="css/vlo.css" type="text/css" />
        <link rel="stylesheet" href="assets/font-awesome/css/fontawesome.min.css" />
        <link rel="stylesheet" href="assets/font-awesome/css/solid.min.css" />
        <link rel="stylesheet" href="assets/font-awesome/css/regular.min.css" />
        <link rel="stylesheet" href="assets/font-awesome/css/v4-shims.min.css" />
        <link rel="icon" href="images/favicon.png" type="image/png"/> 
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
    </head>
    <body class="non-js">
        <header wicket:id="header" id="header" role="banner">
            <div class="clarin-top d-sm-none">
                <a class="logo mx-auto d-block" href="http://www.clarin.eu"></a>
            </div>
            <span class="qualifier snapshot">TESTING</span>
            <span class="qualifier beta">BETA</span>
            <nav wicket:id="menu" class="navbar navbar-expand-sm" role="navigation">
                <div class="container">
                    <a wicket:id="brandLink" class="navbar-brand"><span wicket:id="brandLabel"></span></a>
                    <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#vlo-navbar" aria-controls="vlo-navbar" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="vlo-navbar">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item"><a wicket:id="searchLink" class="nav-link search-link"><wicket:message key="vloNavigation.search"/></a></li>
                            <li class="nav-item"><a wicket:id="contributorsLink" class="nav-link contributors-link"><wicket:message key="vloNavigation.contributors"/></a></li>
                            <li class="nav-item"><a wicket:id="helpLink" class="nav-link help-link"><wicket:message key="vloNavigation.help"/></a></li>
                        </ul>
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a wicket:id="clarinLink" class="nav-link clarin-logo d-none d-sm-block"><span>CLARIN</span></a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <div class="container">

            <div class="row">
                <div wicket:id="feedback" id="feedback">[feedback]</div>
            </div>

            <div class="row">
                <!-- page content -->
                <wicket:child />
            </div>
        </div>

        <footer id="footer">
            <div class="container">
                <div class="row">
                    <div class="col-sm-6 order-sm-2 col-12">
                        <!-- CLARIN logo and copyright (center column on larger screens) -->
                        <div class="text-center">
                            <p class="footer-fineprint">
                                <wicket:message key="vloFooter.serviceBy" escape="false">[Service provided by <a href="https://www.clarin.eu">CLARIN</a>]</wicket:message>
                            </p>
                        </div>
                    </div>
                    <div class="col-sm-3 order-sm-1 col-12">
                        <div class="d-none d-sm-block">
                            <!-- On smaller screen, show about link with contact link -->
                            <wicket:link><a href="AboutPage.html"><wicket:message key="vloFooter.about">[About]</wicket:message></a></wicket:link>
                        </div>
                        <div class="version-info text-center-xs">
                            <!-- Center version on mobile -->
                            v<wicket:message key="vlo.version" />
                        </div>
                        <wicket:enclosure>
                            <div class="instance-info footer-hidden-text text-center-xs">
                                <wicket:container wicket:id="instanceInfo">Instance info</wicket:container>
                            </div>
                        </wicket:enclosure>
                    </div>
                    <div class="col-sm-3 order-sm-3 d-none d-sm-block text-end">
                        <!-- Contact link in right column on larger screens -->
                        <a wicket:message="href:vloFooter.contactMail"><wicket:message key="vloFooter.contact" /></a>
                    </div>
                    <div class="d-block d-sm-none text-center">
                        <!-- Both links in centered div on mobile -->
                        <wicket:link><a href="AboutPage.html"><wicket:message key="vloFooter.about">[About]</wicket:message></a></wicket:link>
                        &nbsp;<a wicket:message="href:vloFooter.contactMail"><wicket:message key="vloFooter.contact" /></a>
                    </div>
                </div>
            </div>
        </footer>

        <wicket:container wicket:id="piwik"><!-- piwik tracker --></wicket:container>
    </body>

    <wicket:container wicket:id="bottomSnippet"><!-- snippets --></wicket:container>

</html>
